<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kart Racer</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="game">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">

            <div id="lapDisplay">
                LAP 1 / 3
            </div>

            <div id="timerDisplay">
                0:00.00
            </div>

            <div id="speedDisplay">
                SPEED 0
            </div>

        </div>

        <div id="controls">
            WASD / ARROW KEYS — DRIVE
            <br>
            SPACE — DRIFT
        </div>

    </div>

    <script type="module" src="./game.js"></script>

</body>

</html>
